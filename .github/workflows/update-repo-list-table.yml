name: Update repo table

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:       # manual run button
  push:
    branches: [master]
    paths: [".github/scripts/update-repos.sh"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/update-repos.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update repo table"
          git push
